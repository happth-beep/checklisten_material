<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">Daniell-Zelle bei Entladung</title><desc id="desc">U-Rohr mit zwei Elektroden, poröser Fritte zwischen den Flüssigkeitsräumen und einem äußeren Verbraucher.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17685c"/></marker><pattern id="pores" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#ece6d9"/><circle cx="5" cy="5" r="1.8" fill="#7f7765"/></pattern></defs><rect width="100%" height="100%" rx="16" fill="#fbfaf6"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183b36"><path d="M155 160V378Q155 400 179 400H701Q725 400 725 378V160" fill="none" stroke="#42685f" stroke-width="5"/><path d="M300 160V285H580V160" fill="none" stroke="#42685f" stroke-width="5"/><path d="M159 223H296V289H439V396H179Q159 396 159 377Z" fill="#dce8e0"/><path d="M441 289H584V223H721V377Q721 396 701 396H441Z" fill="#b8dce9"/><rect x="424" y="289" width="32" height="107" fill="url(#pores)" stroke="#7f7765" stroke-width="2"/><rect x="200" y="145" width="40" height="192" rx="3" fill="#98a7a5" stroke="#475f5b" stroke-width="2"/><rect x="640" y="145" width="40" height="192" rx="3" fill="#c88152" stroke="#875433" stroke-width="2"/><path d="M220 145V94H375M505 94H660V145" fill="none" stroke="#27483f" stroke-width="4"/><rect x="375" y="75" width="130" height="38" rx="3" fill="#fff" stroke="#27483f" stroke-width="3"/><text x="440" y="57" font-size="18" text-anchor="middle" fill="#183b36">Verbraucher</text><path d="M275 35H594" fill="none" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><text x="438" y="25" font-size="19" text-anchor="middle" fill="#183b36">Elektronen außen: Zn → Cu</text><text x="219" y="196" font-size="22" text-anchor="middle" fill="#183b36">Zn</text><text x="660" y="196" font-size="22" text-anchor="middle" fill="#183b36">Cu</text><text x="100" y="266" font-size="20" text-anchor="end" fill="#183b36">ZnSO₄</text><text x="100" y="293" font-size="18" text-anchor="end" fill="#183b36">Lösung</text><text x="752" y="266" font-size="20" text-anchor="start" fill="#183b36">CuSO₄</text><text x="752" y="293" font-size="18" text-anchor="start" fill="#183b36">Lösung</text><path d="M112 262H175M746 262H710" fill="none" stroke="#42685f" stroke-width="2"/><text x="440" y="273" font-size="18" text-anchor="middle" fill="#183b36">Fritte</text><text x="220" y="439" font-size="21" text-anchor="middle" fill="#183b36">Zn → Zn²⁺ + 2 e⁻</text><text x="660" y="439" font-size="21" text-anchor="middle" fill="#183b36">Cu²⁺ + 2 e⁻ → Cu</text></g></svg>