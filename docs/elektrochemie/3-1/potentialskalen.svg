<svg xmlns="http://www.w3.org/2000/svg" width="800" height="445" viewBox="0 0 800 445" role="img" aria-labelledby="title desc"><title id="title">Zwei Potentialskalen mit gleichem Abstand</title><desc id="desc">Die Potentialwerte aller drei Halbzellen sind auf der rechten Skala um 0,34 Volt verschoben. Der Abstand zwischen Kupfer und Zink bleibt 1,10 Volt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17685c"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#233c35"><text x="30" y="38" font-size="24" font-weight="bold">Ein Abstand · zwei Bezugspunkte</text>
<text x="180" y="83" text-anchor="middle">Bezug: NWE = 0 V</text><text x="580" y="83" text-anchor="middle">Bezug: Cu = 0 V</text>
<path d="M80 370V115" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M480 370V115" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M68 145H305M68 210H305M68 355H305M468 145H705M468 210H705M468 355H705" stroke="#b4c3b9" stroke-width="2"/>
<g font-size="21"><text x="96" y="137">Cu: +0,34 V</text><text x="96" y="202">H⁺/H₂: 0,00 V</text><text x="96" y="347">Zn: −0,76 V</text><text x="496" y="137">Cu: 0,00 V</text><text x="496" y="202">H⁺/H₂: −0,34 V</text><text x="496" y="347">Zn: −1,10 V</text></g>
<path d="M318 148V352" stroke="#17685c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M718 148V352" stroke="#17685c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="330" y="262">1,10 V</text><text x="730" y="262">1,10 V</text>
<text x="400" y="412" text-anchor="middle">Alle Werte rechts = Werte links − 0,34 V</text></g></svg>