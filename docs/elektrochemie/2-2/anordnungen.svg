idth="150" height="85" rx="12" fill="#e8ede5" stroke="#42685f" stroke-width="2"/><rect x="595" y="325" width="150" height="85" rx="12" fill="#e8ede5" stroke="#42685f" stroke-width="2"/><text x="210" y="357" font-size="25" text-anchor="middle" fill="#183b36">Cu</text><text x="210" y="388" font-size="17" text-anchor="middle" fill="#183b36">Halbzelle</text><text x="670" y="357" font-size="25" text-anchor="middle" fill="#183b36">Zn</text><text x="670" y="388" font-size="17" text-anchor="middle" fill="#183b36">Halbzelle</text><path d="M210 325V275H385M495 275H670V325" fill="none" stroke="#42685f" stroke-width="3"/><rect x="385" y="258" width="110" height="34" fill="white" stroke="#42685f" stroke-width="2"/><text x="440" y="243" font-size="18" text-anchor="middle" fill="#183b36">Widerstand</text><path d="M285 392H595" fill="none" stroke="#6f8f86" stroke-width="10" stroke-dasharray="7 4"/><text x="440" y="434" font-size="18" text-anchor="middle" fill="#183b36">ionenleitende Verbindung</text></g></svg>