<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc">
<title id="title">Unbeschriftetes Daniell-Modell für Aufgabe A</title>
<desc id="desc">Links taucht eine Zinkelektrode in Zinksulfatlösung, rechts eine Kupferelektrode in Kupfersulfatlösung. Die Metallleitung führt über einen Widerstand. Eine Kaliumnitrat-Salzbrücke verbindet die Flüssigkeiten. Polzeichen und Ladungswege sollen ergänzt werden.</desc>
