<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d"><title id="t">PEM-Brennstoffzelle im Betrieb</title><desc id="d">Elektronen fließen außen von der negativen Wasserstoffanode über einen Verbraucher zur positiven Sauerstoffkathode. Protonen passieren die Membran nach rechts; an der Kathode entsteht Wasser.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17685c"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#aa613c"/></marker></defs><rect width="780" height="490" rx="18" fill="#faf8f1"/><rect x="226" y="196" width="62" height="172" fill="#bdd9d0"/><rect x="345" y="177" width="90" height="217" rx="10" fill="#eee1b3"/><rect x="492" y="196" width="62" height="172" fill="#bdd9d0"/><rect x="317" y="41" width="146" height="45" rx="8" fill="#e5efec" stroke="#223c39" stroke-width="2"/><g fill="none" stroke="#17685c" stroke-width="3"><path d="M255 196V64H317"/><path d="M463 64H525V195" marker-end="url(#a)"/><path d="M272 115H458" marker-end="url(#a)"/><path d="M286 281H491" marker-end="url(#a)"/></g><g fill="none" stroke="#aa613c" stroke-width="3"><path d="M80 241H224" marker-end="url(#b)"/><path d="M705 241H557" marker-end="url(#b)"/><path d="M554 343H705" marker-end="url(#b)"/></g><g font-family="Arial,sans-serif" fill="#223c39" font-size="20" text-anchor="middle"><text x="390" y="70">Verbraucher</text><text x="379" y="143">e⁻ außen →</text><text x="254" y="395">Anode (−)</text><text x="525" y="395">Kathode (+)</text><text x="390" y="237">H⁺ →</text><text x="390" y="338">PEM</text><text x="120" y="219">H₂ hinein</text><text x="659" y="219">O₂ hinein</text><text x="657" y="322">H₂O hinaus</text><text x="390" y="432">Protonen innen, Elektronen außen.</text><text x="390" y="463">Wärme wird an die Umgebung abgegeben.</text></g></svg>