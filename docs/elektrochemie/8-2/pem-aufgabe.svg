<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d"><title id="t">PEM-Schema zum Ergänzen</title><desc id="d">Links Elektrode A mit Wasserstoffzufuhr, rechts B mit Sauerstoffzufuhr. X bezeichnet den äußeren Weg durch einen Verbraucher, Y den Weg durch die Membran, Z den Produktweg rechts.</desc><rect width="780" height="430" rx="18" fill="#faf8f1"/><g fill="none" stroke="#223c39" stroke-width="3"><path d="M247 180V59H323M458 59H533V180"/><rect x="323" y="35" width="135" height="48" rx="8"/></g><rect x="218" y="180" width="58" height="150" fill="#bdd9d0"/><rect x="345" y="165" width="90" height="190" rx="8" fill="#eee1b3"/><rect x="504" y="180" width="58" height="150" fill="#bdd9d0"/><g fill="none" stroke="#7a8d86" stroke-width="3" stroke-dasharray="8 5"><path d="M286 250H496M70 210H216M564 210H710M564 312H710"/></g><g font-family="Arial,sans-serif" fill="#223c39" font-size="23" text-anchor="middle"><text x="391" y="66" font-size="18">Verbraucher</text><text x="390" y="119">X: …</text><text x="247" y="364">A: …</text><text x="533" y="364">B: …</text><text x="390" y="230">Y: …</text><text x="390" y="312" font-size="18">Membran</text><text x="130" y="190">H₂ →</text><text x="660" y="190">← O₂</text><text x="665" y="292">Z: …</text><text x="390" y="401" font-size="18">Ergänze Teilchen, Richtungen, Elektrodennamen und Pole.</text></g></svg>