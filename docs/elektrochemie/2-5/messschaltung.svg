<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="title desc"><title id="title">Spannungsmessung mit zuschaltbarer Last</title><desc id="desc">Hochohmiges Voltmeter parallel zwischen Zink und Kupfer. COM an Zink, roter V-Anschluss an Kupfer. Ein zweiter paralleler Zweig enthält Lastschalter und Widerstand.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17685c"/></marker><pattern id="pores" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#ece6d9"/><circle cx="5" cy="5" r="1.8" fill="#7f7765"/></pattern></defs><rect width="100%" height="100%" rx="16" fill="#fbfaf6"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183b36"><path d="M200 305V95H401M479 95H680V305M200 185H365M475 185H680" fill="none" stroke="#42685f" stroke-width="4"/><circle cx="440" cy="95" r="38" fill="white" stroke="#42685f" stroke-width="3"/><circle cx="365" cy="185" r="4" fill="#183b36"/><circle cx="408" cy="185" r="4" fill="#183b36"/><path d="M365 185L401 157" fill="none" stroke="#42685f" stroke-width="3"/><path d="M408 185H442" fill="none" stroke="#42685f" stroke-width="4"/><rect x="442" y="168" width="105" height="34" fill="white" stroke="#42685f" stroke-width="3"/><rect x="135" y="306" width="130" height="83" rx="10" fill="#dce8e0" stroke="#42685f" stroke-width="2"/><rect x="615" y="306" width="130" height="83" rx="10" fill="#b8dce9" stroke="#42685f" stroke-width="2"/><path d="M265 358H615" stroke="#769e92" stroke-width="10" stroke-dasharray="8 4"/><text x="440" y="104" font-size="27" text-anchor="middle" fill="#183b36">V</text><text x="255" y="71" font-size="18" text-anchor="start" fill="#183b36">schwarz / COM</text><text x="515" y="71" font-size="18" text-anchor="start" fill="#a6432e">rot / V</text><text x="384" y="229" font-size="17" text-anchor="middle" fill="#183b36">Lastschalter</text><text x="495" y="155" font-size="18" text-anchor="middle" fill="#183b36">R</text><text x="200" y="341" font-size="24" text-anchor="middle" fill="#183b36">Zn</text><text x="200" y="369" font-size="18" text-anchor="middle" fill="#183b36">Minuspol</text><text x="680" y="341" font-size="24" text-anchor="middle" fill="#183b36">Cu</text><text x="680" y="369" font-size="18" text-anchor="middle" fill="#183b36">Pluspol</text><text x="440" y="400" font-size="19" text-anchor="middle" fill="#183b36">Ionenweg der Zelle</text><text x="440" y="443" font-size="18" text-anchor="middle" fill="#183b36">Voltmeter und Last liegen an denselben zwei Zellanschlüssen.</text></g></svg>