<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">Energieflüsse beim Laden und Entladen</title><desc id="desc">Elektrische Energie wird beim Laden chemisch gespeichert, beim Entladen wird chemische Energie elektrisch nutzbar; in beiden Fällen entsteht Wärme.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#17685c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" font-size="19" fill="#263f3a"><text x="35" y="40" font-weight="bold" font-size="23">Laden</text><rect x="35" y="65" width="215" height="70" rx="8" fill="#e6d1a9"/><text x="142" y="95" text-anchor="middle">elektrische</text><text x="142" y="119" text-anchor="middle">Energie</text><path d="M263 100H410" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="65" width="280" height="70" rx="8" fill="#b9dbd0"/><text x="570" y="95" text-anchor="middle">chemisch gespeicherte</text><text x="570" y="119" text-anchor="middle">Energie</text><path d="M340 103V167" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="166">Wärme</text><text x="35" y="245" font-weight="bold" font-size="23">Entladen</text><rect x="35" y="270" width="215" height="70" rx="8" fill="#b9dbd0"/><text x="142" y="300" text-anchor="middle" font-size="17">chemisch gespeicherte</text><text x="142" y="324" text-anchor="middle">Energie</text><path d="M263 305H410" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="270" width="280" height="70" rx="8" fill="#e6d1a9"/><text x="570" y="300" text-anchor="middle">elektrisch nutzbare</text><text x="570" y="324" text-anchor="middle">Energie</text><path d="M340 308V372" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="371">Wärme</text></g></svg>