<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Strom und Ladung</title><desc id="desc">Konstruiertes Beispiel mit 0,2 Ampere für 300 Sekunden und 0,1 Ampere für weitere 200 Sekunden.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#17685c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" font-size="19" fill="#263f3a"><text x="60" y="33" font-size="23" font-weight="bold">Ladung als Fläche unter der Stromkurve</text><path d="M95 60V325H700" fill="none" stroke="#263f3a" stroke-width="2"/><rect x="95" y="105" width="330" height="220" fill="#b9dbd0"/><rect x="425" y="215" width="220" height="110" fill="#e6d1a9"/><path d="M95 105H425V215H645" fill="none" stroke="#17685c" stroke-width="4"/><g font-size="18"><text x="22" y="70">I / A</text><text x="660" y="362">t / s</text><text x="40" y="112">0,2</text><text x="40" y="222">0,1</text><text x="65" y="333">0</text><text x="90" y="354">0</text><text x="406" y="354">300</text><text x="627" y="354">500</text></g><text x="260" y="212" text-anchor="middle" font-size="27">60,0 C</text><text x="535" y="280" text-anchor="middle" font-size="27">20,0 C</text><text x="380" y="403" text-anchor="middle">Gesamt: 80,0 C</text></g></svg>