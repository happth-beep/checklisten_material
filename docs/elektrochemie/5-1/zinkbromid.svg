<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 665" role="img" aria-labelledby="title desc"><title id="title">Laden und Entladen des Zinkbromid-Modells</title><desc id="desc">Laden bildet links Zink und rechts Brom; Entladen verbraucht beide Stoffe. Anoden- und Kathodenrolle wechseln, Polzeichen bleiben gleich.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#17685c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" font-size="19" fill="#263f3a"><g transform="translate(0,0)"><rect x="12" y="5" width="736" height="310" rx="14" fill="#f4f7f5"/><text x="35" y="38" font-size="23" font-weight="bold">Laden · Elektrolyse</text><path d="M100 205V92H280 M480 92H660V205" fill="none" stroke="#43554e" stroke-width="3"/><rect x="280" y="67" width="200" height="50" rx="7" fill="#fff" stroke="#43554e" stroke-width="2"/><text x="380" y="99" text-anchor="middle">Spannungsquelle</text><rect x="65" y="165" width="630" height="91" fill="#dceee8" stroke="#80998f"/><line x1="380" y1="165" x2="380" y2="256" stroke="#80998f" stroke-width="4" stroke-dasharray="5 4"/><rect x="92" y="147" width="16" height="94" fill="#71858a"/><rect x="652" y="147" width="16" height="94" fill="#53635b"/><text x="252" y="99" font-size="26">−</text><text x="492" y="99" font-size="26">+</text><text x="212" y="194" text-anchor="middle" font-weight="bold">Zink entsteht</text><text x="551" y="194" text-anchor="middle" font-weight="bold">Brom entsteht</text><text x="212" y="226" text-anchor="middle" font-size="17">Zn²⁺ + 2 e⁻ → Zn</text><text x="551" y="226" text-anchor="middle" font-size="17">2 Br⁻ → Br₂ + 2 e⁻</text><text x="212" y="284" text-anchor="middle">Kathode (−)</text><text x="551" y="284" text-anchor="middle">Anode (+)</text><path d="M240 127H180V155" fill="none" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M656 151V127H525" fill="none" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><text x="200" y="120" font-size="16">e⁻</text><text x="550" y="120" font-size="16">e⁻</text></g><g transform="translate(0,335)"><rect x="12" y="5" width="736" height="310" rx="14" fill="#f4f7f5"/><text x="35" y="38" font-size="23" font-weight="bold">Entladen · galvanischer Betrieb</text><path d="M100 205V92H280 M480 92H660V205" fill="none" stroke="#43554e" stroke-width="3"/><rect x="280" y="67" width="200" height="50" rx="7" fill="#fff" stroke="#43554e" stroke-width="2"/><text x="380" y="99" text-anchor="middle">Verbraucher</text><rect x="65" y="165" width="630" height="91" fill="#dceee8" stroke="#80998f"/><line x1="380" y1="165" x2="380" y2="256" stroke="#80998f" stroke-width="4" stroke-dasharray="5 4"/><rect x="92" y="147" width="16" height="94" fill="#71858a"/><rect x="652" y="147" width="16" height="94" fill="#53635b"/><text x="252" y="99" font-size="26">−</text><text x="492" y="99" font-size="26">+</text><text x="212" y="194" text-anchor="middle" font-weight="bold">Zink löst sich</text><text x="551" y="194" text-anchor="middle" font-weight="bold">Brom nimmt ab</text><text x="212" y="226" text-anchor="middle" font-size="17">Zn → Zn²⁺ + 2 e⁻</text><text x="551" y="226" text-anchor="middle" font-size="17">Br₂ + 2 e⁻ → 2 Br⁻</text><text x="212" y="284" text-anchor="middle">Anode (−)</text><text x="551" y="284" text-anchor="middle">Kathode (+)</text><path d="M185 61H258" fill="none" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 61H590" fill="none" stroke="#17685c" stroke-width="3" marker-end="url(#arrow)"/><text x="210" y="54" font-size="16">e⁻</text><text x="535" y="54" font-size="16">e⁻</text></g></g></svg>