<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 665" role="img" aria-labelledby="title desc"><title id="title">Schaltungen zum Ergänzen</title><desc id="desc">Laden mit Spannungsquelle oben, Entladen mit Verbraucher unten. Elektrodennamen, Polung und Elektronenpfeile fehlen.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#17685c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" font-size="19" fill="#263f3a"><g transform="translate(0,0)"><rect x="12" y="5" width="736" height="310" rx="14" fill="#f4f7f5"/><text x="35" y="38" font-size="23" font-weight="bold">Laden · Elektrolyse</text><path d="M100 205V92H280 M480 92H660V205" fill="none" stroke="#43554e" stroke-width="3"/><rect x="280" y="67" width="200" height="50" rx="7" fill="#fff" stroke="#43554e" stroke-width="2"/><text x="380" y="99" text-anchor="middle">Spannungsquelle</text><rect x="65" y="165" width="630" height="91" fill="#dceee8" stroke="#80998f"/><line x1="380" y1="165" x2="380" y2="256" stroke="#80998f" stroke-width="4" stroke-dasharray="5 4"/><rect x="92" y="147" width="16" height="94" fill="#71858a"/><rect x="652" y="147" width="16" height="94" fill="#53635b"/><text x="145" y="280" text-anchor="middle">Zinkseite L</text><text x="615" y="280" text-anchor="middle">Bromseite R</text><text x="380" y="305" text-anchor="middle" font-size="15">Ionenleitende Trennung in der Mitte</text></g><g transform="translate(0,335)"><rect x="12" y="5" width="736" height="310" rx="14" fill="#f4f7f5"/><text x="35" y="38" font-size="23" font-weight="bold">Entladen · galvanischer Betrieb</text><path d="M100 205V92H280 M480 92H660V205" fill="none" stroke="#43554e" stroke-width="3"/><rect x="280" y="67" width="200" height="50" rx="7" fill="#fff" stroke="#43554e" stroke-width="2"/><text x="380" y="99" text-anchor="middle">Verbraucher</text><rect x="65" y="165" width="630" height="91" fill="#dceee8" stroke="#80998f"/><line x1="380" y1="165" x2="380" y2="256" stroke="#80998f" stroke-width="4" stroke-dasharray="5 4"/><rect x="92" y="147" width="16" height="94" fill="#71858a"/><rect x="652" y="147" width="16" height="94" fill="#53635b"/><text x="145" y="280" text-anchor="middle">Zinkseite L</text><text x="615" y="280" text-anchor="middle">Bromseite R</text><text x="380" y="305" text-anchor="middle" font-size="15">Ionenleitende Trennung in der Mitte</text></g></g></svg>