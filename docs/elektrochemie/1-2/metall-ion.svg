<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="title desc"><title id="title">Metall und hydratisierte Metallionen</title><desc id="desc">Kupfermetall besteht modellhaft aus positiv geladenen Atomrümpfen und beweglichen Elektronen. Gelöstes Kupfersulfat enthält getrennte hydratisierte Kupferionen und Sulfationen. Beide Gesamtbereiche sind elektrisch neutral.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17685c"/></marker><pattern id="pores" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#ece6d9"/><circle cx="5" cy="5" r="1.8" fill="#7f7765"/></pattern></defs><rect width="100%" height="100%" rx="16" fill="#fbfaf6"/><g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183b36"><rect x="40" y="65" width="330" height="255" rx="12" fill="#c9a183"/><rect x="440" y="65" width="400" height="255" rx="12" fill="#e2f0f2"/><text x="205" y="40" font-size="22" text-anchor="middle" fill="#183b36">Kupfermetall Cu(s)</text><text x="640" y="40" font-size="22" text-anchor="middle" fill="#183b36">CuSO₄-Lösung</text><circle cx="110" cy="125" r="25" fill="#af7551" stroke="#82533a" stroke-width="2"/><text x="110" y="132" font-size="22" text-anchor="middle" fill="#183b36">+</text><circle cx="210" cy="125" r="25" fill="#af7551" stroke="#82533a" stroke-width="2"/><text x="210" y="132" font-size="22" text-anchor="middle" fill="#183b36">+</text><circle cx="310" cy="125" r="25" fill="#af7551" stroke="#82533a" stroke-width="2"/><text x="310" y="132" font-size="22" text-anchor="middle" fill="#183b36">+</text><circle cx="110" cy="245" r="25" fill="#af7551" stroke="#82533a" stroke-width="2"/><text x="110" y="252" font-size="22" text-anchor="middle" fill="#183b36">+</text><circle cx="210" cy="245" r="25" fill="#af7551" stroke="#82533a" stroke-width="2"/><text x="210" y="252" font-size="22"