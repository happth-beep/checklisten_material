<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Normalwasserstoffelektrode: Funktionsschema</title><desc id="desc">Wasserstoff bei 1 bar erreicht die platinierte Pt-Oberfläche in einer Lösung mit Protonenaktivität 1. Ein Draht stellt den elektrischen Kontakt her; eine ionenleitende Verbindung verbindet die Lösung mit der Partnerhalbzelle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17685c"/></marker></defs><rect width="100%" height="100%" fill="#fffdf8"/><g font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#233c35"><path d="M140 170V365Q140 385 160 385H420Q440 385 440 365V170" fill="none" stroke="#819c91" stroke-width="4"/><path d="M144 230H436V364Q436 380 420 380H160Q144 380 144 364Z" fill="#deece4"/>
